<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · {{ loja.nome_loja }}</title>
  <link rel="icon" href="/static/img/logo-instagram.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap">
  <link rel="stylesheet" href="/static/css/loja.css?v=9">
  <link rel="stylesheet" href="/static/css/admin.css?v=3">
</head>
<body class="quadriculado">
  <main class="entrar-pagina">
    <form class="entrar-cartao bloco" method="post" action="/admin/entrar">
      <span class="marca"><img src="/static/img/logo-instagram.jpg" alt="" width="56" height="56" style="width:56px;height:56px"></span>
      <h1 class="titulo-3" style="text-align:center">Área da loja</h1>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
      <label class="campo"><span>E-mail</span><input class="entrada" type="email" name="email" autocomplete="username" required autofocus></label>
      <label class="campo"><span>Senha</span><input class="entrada" type="password" name="senha" autocomplete="current-password" required></label>
      <button class="botao largo" type="submit">Entrar</button>
      <a href="/" style="text-align:center; font-size:0.92rem">Voltar para a loja</a>
    </form>
  </main>
</body>
</html>
